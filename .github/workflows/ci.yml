name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Built from source with this job's toolchain: the published v1.64.8
      # binary is built with Go 1.24 and refuses a module targeting 1.26.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Swagger is up to date
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          make swagger
          git diff --exit-code docs/swagger

  go-postgres:
    name: Go (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hephaestus
          POSTGRES_PASSWORD: hephaestus
          POSTGRES_DB: hephaestus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hephaestus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        env:
          HEPHAESTUS_TEST_POSTGRES_DSN: host=127.0.0.1 user=hephaestus password=hephaestus dbname=hephaestus port=5432 sslmode=disable
        run: make test-integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
